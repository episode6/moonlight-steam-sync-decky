# CI for the Moonlight Sync plugin (spec 3.6.2) and the moonlight-steam-sync
# CLI under cli/. No Docker and no Decky CLI: the CLI zipapp is built from
# cli/src by backend/entrypoint.sh (scripts/build_cli.py) and the zip by
# scripts/package.py, which reproduces the Decky CLI's layout. The plugin PRs
# are stacked on feature branches, so pull_request carries no branch filter.
#
# probes/ (the PR-0 device-probe kit) is left entirely to its own workflow
# (probe.yml, path-filtered to probes/**): the root pnpm project, tsconfig,
# eslint, vitest, ruff and pytest all ignore probes/ explicitly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
      - run: sh -n backend/entrypoint.sh
      - run: sh -n cli/install.sh
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .

  frontend:
    name: Frontend (typecheck, lint, vitest, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  backend:
    name: Backend (ruff over the repo, pytest on Python 3.13.5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # decky-loader is a PyInstaller bundle and brings its own
          # interpreter, so this is not the version the backend itself runs
          # under. It is pinned to the exact Python a stock SteamOS ships
          # because that is what the CLI child runs under on a Deck (the
          # backend spawns `python3 <cli>`), and it is the version these
          # backend tests therefore target.
          python-version: "3.13.5"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest tests/ -v

  cli:
    name: CLI (pytest, zipapp smoke) on Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The 3.11 floor cli/pyproject.toml declares, plus the exact Python a
        # stock SteamOS ships (3.13.5, verified on a fresh install 2026-09-17)
        # -- the version the CLI actually has to run on. When SteamOS moves,
        # change 3.13.5 here, in the backend job and in release.yml.
        python-version: ["3.11", "3.13.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e ./cli
      - run: python -m pytest cli -v
      - name: Build the zipapp
        run: python scripts/build_cli.py --out build/moonlight-steam-sync.pyz
      - name: Smoke test -- --version
        run: python build/moonlight-steam-sync.pyz --version
      - name: Smoke test -- doctor
        # `doctor` always exits 0 (it reports what it finds, it does not
        # require a Steam install or a moonlight binary to run in CI).
        run: python build/moonlight-steam-sync.pyz doctor

  package:
    name: Package Moonlight-Sync.zip
    needs: [frontend, backend, cli]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Build the CLI from cli/src
        run: backend/entrypoint.sh
      - run: python3 scripts/package.py --require-cli --list
      - uses: actions/upload-artifact@v7
        with:
          name: Moonlight-Sync
          path: out/Moonlight-Sync.zip
          if-no-files-found: error
