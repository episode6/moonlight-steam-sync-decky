# Release for the Moonlight Sync Decky plugin and the moonlight-steam-sync
# CLI (spec 3.6.2, section 4 PR-8). One version, one release, four assets.
#
# Builds the same Docker-free artifact ci.yml's `package` job does:
# backend/entrypoint.sh builds the CLI zipapp from cli/src
# (scripts/build_cli.py, which refuses a CLI __version__ that is not
# package.json's "version"), then scripts/package.py --require-cli bundles it
# into out/Moonlight-Sync.zip. The zipapp is also a release asset of its own,
# moonlight-steam-sync.pyz, which cli/install.sh downloads for a CLI-only
# install. Both are smoke-run and checksummed.
#
# The build job also runs on pull_request and workflow_dispatch, so the
# release path is exercised by ordinary CI rather than sitting untested until
# a tag; only the final "create the release and attach the assets" job is
# tag-only. See AGENTS.md "Cutting a release" for the command sequence that
# pushes a v* tag -- no agent runs it unasked.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/setup-python@v7
        with:
          # The exact Python a stock SteamOS ships: what the CLI runs under
          # on a Deck. ci.yml's `cli` job also covers the 3.11 floor.
          python-version: "3.13.5"

      - name: The tag is package.json's version
        # The plugin and the CLI both report package.json's "version"
        # (build_cli.py holds the CLI to it), so a tag that says otherwise
        # would publish assets whose --version disagrees with the release.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v${version} (package.json)"
            exit 1
          fi

      - name: Build the CLI from cli/src (smoke-runs --version)
        run: backend/entrypoint.sh

      - name: Smoke test the CLI -- doctor
        # `doctor` always exits 0 (it reports what it finds, it does not
        # require a Steam install or a moonlight binary to run in CI).
        run: python3 backend/out/moonlight-steam-sync.pyz doctor

      - name: Package the zip
        run: python3 scripts/package.py --require-cli

      - name: Checksums
        # Record each checksum against the bare filename, not the build path,
        # so `sha256sum -c` against the downloaded release assets -- all in
        # one directory, with no `out/` prefix -- verifies cleanly (install.sh
        # and cli/install.sh compare the hash alone either way).
        run: |
          cp backend/out/moonlight-steam-sync.pyz out/
          cd out
          sha256sum Moonlight-Sync.zip | tee Moonlight-Sync.zip.sha256
          sha256sum moonlight-steam-sync.pyz | tee moonlight-steam-sync.pyz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: Moonlight-Sync
          path: |
            out/Moonlight-Sync.zip
            out/Moonlight-Sync.zip.sha256
            out/moonlight-steam-sync.pyz
            out/moonlight-steam-sync.pyz.sha256
          if-no-files-found: error

  github-release:
    name: Create the release and attach the assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Moonlight-Sync
          path: out

      - name: Create the release and attach the zip, the CLI and their checksums
        # Idempotent on purpose: the tag can reach GitHub either by a plain
        # `git push` (no release exists yet, so this creates one) or via `gh
        # release create` from a workstation (the release already exists and
        # only the assets are missing). Re-running a failed release run lands
        # in the second case too, so: try to create, and fall back to
        # uploading into the existing release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="out/Moonlight-Sync.zip out/Moonlight-Sync.zip.sha256 out/moonlight-steam-sync.pyz out/moonlight-steam-sync.pyz.sha256"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets into it."
            gh release upload "${GITHUB_REF_NAME}" $assets \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" $assets \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
